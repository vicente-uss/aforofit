name: Certificación desechable 022
on:
  push:
    branches: [registro-corporal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aplicacion:
    name: Vitest, lint, build y auditoría npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: clave-ficticia-build
      - run: npm audit
      - run: npm audit --omit=dev
        if: "!cancelled()"
  integracion:
    name: SQL, reversión y Chromium a 360 px
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Levantar Supabase desechable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          supabase init
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit >/dev/null
      - name: Ejecutar todas las suites SQL históricas y Cron
        run: bash .github/qa-019.sh
      - name: Probar permisos, persistencia, reversión y reaplicación de 022
        run: |
          db() { psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -X -v ON_ERROR_STOP=1 "$@"; }
          db -f supabase/sql/022_registro_corporal.sql
          db -f supabase/pruebas/medidas/mediciones.sql
          db -f supabase/reversion/022_registro_corporal.sql
          [[ $(db -Atc "select to_regclass('public.mediciones') is null") == t ]]
          db -f supabase/sql/022_registro_corporal.sql
          db -f supabase/pruebas/medidas/mediciones.sql
      - name: Probar el flujo real y capturar evidencia móvil
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export NEXT_TELEMETRY_DISABLED=1
          npm ci
          npm run build
          npm install --prefix "$RUNNER_TEMP/qa-022" --no-save playwright@1.65.1
          "$RUNNER_TEMP/qa-022/node_modules/.bin/playwright" install --with-deps chromium
          cp .github/qa-022-movil.mjs "$RUNNER_TEMP/qa-022/"
          npm start -- --hostname 127.0.0.1 >"$RUNNER_TEMP/next-022.log" 2>&1 &
          trap 'cat "$RUNNER_TEMP/next-022.log"' EXIT
          for intento in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/auth/login >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/evidencia-022"
          node "$RUNNER_TEMP/qa-022/qa-022-movil.mjs" "$RUNNER_TEMP/evidencia-022"
      - uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: registro-corporal-360px
          path: ${{ runner.temp }}/evidencia-022/*.png
      - name: Destruir Supabase desechable
        if: always()
        run: supabase stop --no-backup
