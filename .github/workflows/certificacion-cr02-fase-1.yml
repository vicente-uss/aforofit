name: Certificación desechable CR-02
on:
  push:
    branches: [cr02-inscripcion-acceso, cr02-profesor-admin]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aplicacion:
    name: Vitest, lint y build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-build
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run lint
        if: "!cancelled()"
      - run: npm run build
        if: "!cancelled()"

  integracion:
    name: Supabase desechable · ${{ matrix.grupo }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        grupo: [cr02, regresion-019]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Levantar Supabase desechable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          supabase init
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit >/dev/null
      - name: Ejecutar suites SQL
        env:
          GRUPO_QA: ${{ matrix.grupo }}
          AFOROFIT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          if [[ "$GRUPO_QA" == regresion-019 ]]; then
            bash .github/qa-019.sh
          else
            bash .github/qa-cr02-fase-1-sql.sh
            bash .github/qa-023-concurrencia.sh
            bash .github/qa-024-concurrencia.sh
            psql "$AFOROFIT_TEST_DATABASE_URL" -Xv ON_ERROR_STOP=1 <<'SQL'
          delete from public.visitas where rutina_id in (
            select id from public.rutinas where nombre in ('Carrera 023 uno', 'Carrera 023 dos'));
          delete from public.rutinas where nombre in ('Carrera 023 uno', 'Carrera 023 dos');
          delete from public.alumnos where rut in ('QA-024-D', 'QA-024-A', 'QA-024-R', 'QA-024-N');
          select privado.sincronizar_aforo();
          SQL
          fi
      - name: Chromium, Storage y Realtime
        if: matrix.grupo == 'cr02'
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export AFOROFIT_TEST_DATABASE_URL="$DB_URL"
          export NEXT_TELEMETRY_DISABLED=1
          npm ci --no-audit
          npm run build
          npm install --prefix "$RUNNER_TEMP/qa-cr02" --no-save playwright@1.65.1
          "$RUNNER_TEMP/qa-cr02/node_modules/.bin/playwright" install --with-deps chromium
          cp .github/qa-{019-realtime,023-movil,024-movil,cr02-fase-1-movil,cr02-modo-admin}.mjs "$RUNNER_TEMP/qa-cr02/"
          npm start -- --hostname 127.0.0.1 >"$RUNNER_TEMP/next-cr02.log" 2>&1 &
          trap 'cat "$RUNNER_TEMP/next-cr02.log"' EXIT
          for intento in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/auth/login >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/evidencia-cr02"
          node "$RUNNER_TEMP/qa-cr02/qa-024-movil.mjs" "$RUNNER_TEMP/evidencia-cr02"
          node "$RUNNER_TEMP/qa-cr02/qa-023-movil.mjs" "$RUNNER_TEMP/evidencia-cr02"
          node "$RUNNER_TEMP/qa-cr02/qa-019-realtime.mjs"
          node "$RUNNER_TEMP/qa-cr02/qa-cr02-fase-1-movil.mjs" "$RUNNER_TEMP/evidencia-cr02"
          node "$RUNNER_TEMP/qa-cr02/qa-cr02-modo-admin.mjs" "$RUNNER_TEMP/evidencia-cr02"
      - uses: actions/upload-artifact@v4
        if: matrix.grupo == 'cr02' && !cancelled()
        with:
          name: evidencia-chromium-cr02
          path: ${{ runner.temp }}/evidencia-cr02/*.png
      - name: Destruir Supabase desechable
        if: always()
        run: supabase stop --no-backup
