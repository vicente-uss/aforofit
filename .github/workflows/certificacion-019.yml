name: Certificación desechable 019
on:
  push:
    branches: [estabilidad-final]
permissions:
  contents: read
jobs:
  certificacion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Levantar Supabase desechable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          supabase init
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit >/dev/null
      - name: Certificar SQL, migraciones y Cron
        shell: bash
        run: bash .github/qa-019.sh
      - name: Certificar Realtime en Chromium
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export AFOROFIT_TEST_DATABASE_URL="$DB_URL"
          export NEXT_TELEMETRY_DISABLED=1
          npm ci
          npm run build
          npm install --prefix "$RUNNER_TEMP/realtime-019" --no-save playwright
          "$RUNNER_TEMP/realtime-019/node_modules/.bin/playwright" install --with-deps chromium
          cp .github/qa-019-realtime.cjs "$RUNNER_TEMP/realtime-019/"
          npm start -- --hostname 127.0.0.1 >"$RUNNER_TEMP/next-019.log" 2>&1 &
          trap 'cat "$RUNNER_TEMP/next-019.log"' EXIT
          for intento in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/aforo >/dev/null; then break; fi
            sleep 1
          done
          node "$RUNNER_TEMP/realtime-019/qa-019-realtime.cjs"
      - name: Destruir entorno desechable
        if: always()
        run: supabase stop --no-backup
